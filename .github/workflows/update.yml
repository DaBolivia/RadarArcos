name: Atualizar Radar Arcos

on:
  workflow_dispatch:
  schedule:
    # Todos os dias às 10h13 de Brasília (13h13 UTC).
        - cron: '*/15 * * * *'

permissions:
  contents: write
concurrency:
  group: radar-publicacao
  cancel-in-progress: false
jobs:
  atualizar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RADAR_COMMIT_NAME: ${{ vars.RADAR_COMMIT_NAME }}
      RADAR_COMMIT_EMAIL: ${{ vars.RADAR_COMMIT_EMAIL }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir configuração
        run: python scripts/preflight.py
      - name: Coletar dados oficiais
        run: python scripts/collect.py
      - name: Validar base e páginas
        run: |
          python scripts/check.py
          node --check dist/app.js
          node scripts/check-ui.cjs
      - name: Guardar base validada
        uses: actions/upload-artifact@v4
        with:
          name: radar-arcos-validado
          path: dist/
          retention-days: 30
      - name: Salvar a coleta no GitHub
        run: |
          git config user.name "$RADAR_COMMIT_NAME"
          git config user.email "$RADAR_COMMIT_EMAIL"
          git add dist/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualização automática dos dados oficiais do Radar Arcos"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Solicitar publicação na Vercel
        run: python scripts/deploy.py
      - name: Registrar resultado
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Radar Arcos" >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado do workflow: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "O aceite do Deploy Hook confirma a solicitação, não a conclusão. Confira Ready na Vercel e a data no site." >> "$GITHUB_STEP_SUMMARY"
